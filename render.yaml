services:
  - type: web
    name: advocacia-etec
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        value: https://xfdfnqknajmwzspfqqcw.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
